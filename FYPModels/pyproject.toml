[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-seizure-multimodal"
version = "0.1.0"
description = "Inference-first synchronized video/EEG seizure fusion infrastructure"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
enhancement = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "PyWavelets>=1.4",
  "ptwt>=0.1.9",
  "opencv-python-headless>=4.8",
]
video = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "opencv-python-headless>=4.8",
]
facial = [
  "facenet-pytorch>=2.6,<3",
  "torch>=2.1",
  "torchvision>=0.16",
  "opencv-python-headless>=4.8",
  "mediapipe==0.10.21",
]
eeg = ["tensorflow>=2.15"]
all = [
  "facenet-pytorch>=2.6,<3",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "PyWavelets>=1.4",
  "ptwt>=0.1.9",
  "opencv-python-headless>=4.8",
  "mediapipe==0.10.21",
  "tensorflow>=2.15",
]

[tool.setuptools.packages.find]
include = ["seizure_multimodal*"]

[tool.setuptools.package-data]
"seizure_multimodal.preprocess" = ["README.md"]
"seizure_multimodal.preprocess._speinet" = ["*.json", "*.md", "LICENSE"]
