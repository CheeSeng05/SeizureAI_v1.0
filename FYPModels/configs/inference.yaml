training:
  enabled: false

testing:
  mode: unimodal
  threshold: 0.5
  output_directory: results

data:
  video: test_video/Sz2PG.mp4
  video_labels: test_video/Label.xlsx
  eeg_csv: Epileptic Seizure Recognition.csv
  video_provenance:
    expected_sha256: 819634aac6b8a6fe5779b2da786b6b5697524eee761acccd270c4968af135c67
    upstream_path: dataset/pat01/Sz2PG.mp4
    patient_id: Pat01
    seizure_id: Sz2
    seizure_type: PG
    source: https://huggingface.co/datasets/xuyankun/WU-SAHZU-EMU-Video

video_encoder:
  pretrained: true
  freeze: true
  source: VSViG-main/VSViG.py
  checkpoint: VSViG-main/VSViG-base.pth
  dynamic_partition: VSViG-main/dy_point_order.pt
  pose_source: third_party/lightweight_openpose
  pose_checkpoint: VSViG-main/pose.pth
  pose_input_height: 256
  clip_frames: 30
  clip_stride_frames: 30
  inference_batch_size: 8
  pose_batch_size: 30
  fps: null

eeg_encoder:
  pretrained: true
  freeze: true
  checkpoint: checkpoints/pretrained/eeg/seizure_detector_model.keras
  sampling_rate: 256
  channels: 18
  window_duration_sec: 4
  window_stride_sec: 2
  inference_batch_size: 64
  required_channels:
    - FP1-F7
    - F7-T7
    - T7-P7
    - P7-O1
    - FP1-F3
    - F3-C3
    - C3-P3
    - P3-O1
    - FP2-F4
    - F4-C4
    - C4-P4
    - P4-O2
    - FP2-F8
    - F8-T8
    - T8-P8
    - P8-O2
    - FZ-CZ
    - CZ-PZ
  channel_aliases:
    T7: [T3]
    T8: [T4]
    P7: [T5]
    P8: [T6]
  signal_units: uV
  montage_reference: CHB-MIT bipolar

eeg_annotations:
  # Raw text is always preserved. These provisional categories may be
  # overridden only after clinical/research interpretation is confirmed.
  overrides: {}

eeg_labels:
  mapping:
    1: ictal
    2: non_ictal_epileptogenic_zone_interictal
    3: non_ictal_healthy_brain_area_interictal
    4: non_ictal_healthy_eyes_closed
    5: non_ictal_healthy_eyes_open
  positive_value: 1

simulated_multimodal:
  pairing_policy: first_n
  calculate_artificial_metrics: false
  reference_labels: video

fusion:
  enabled: true
  method: weighted_late_fusion
  trainable: false
  video_weight: 0.20
  eeg_weight: 0.80
  threshold: 0.50
  timeline: eeg
  alignment: overlap_weighted_mean
  require_verified_sync: true
  minimum_video_coverage: 1.0
  weights_clinically_optimized: false
  projection_dim: 128
  hidden_dim: 128
  dropout: 0.3

synchronization:
  require_same_patient: true
  require_same_recording: true
  require_both_modalities: true
  duration_tolerance_sec: 0.05
  video_offset_sec: 0.0
  eeg_offset_sec: 0.0
  video_drift_ppm: 0.0
  eeg_drift_ppm: 0.0
