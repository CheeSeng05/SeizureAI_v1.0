paths:
  raw_annotations: annotations/hukm_raw.csv
  canonical_annotations: annotations/hukm_canonical.csv

annotation_adapter:
  type: generic_tabular
  dataset: hukm
  source: annotations/hukm_raw.csv
  column_map:
    media_id: VideoName
    patient_id: Patient
    start_sec: BeginFrame
    end_sec: FinishFrame
    label: ClinicalState
  label_map:
    Normal: normal
    PreIctal: pre_ictal
    Seizure: ictal
  time_unit: frames
  fps: 25

labels:
  active:
    - normal
    - pre_ictal
    - ictal
