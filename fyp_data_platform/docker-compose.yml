services:
  app:
    build:
      context: ..
      dockerfile: fyp_data_platform/Dockerfile
    image: seizureai-platform:local
    container_name: seizureai-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      FYP_ENVIRONMENT: docker
      FYP_STORAGE_BACKEND: s3
      DATABASE_URL: postgresql+psycopg://${DB_USER:-fyp_user}:${DB_PASSWORD:-change_me}@postgres:5432/${DB_NAME:-fyp_data}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-fyp_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET:-fyp-local}
      S3_PREFIX: ${S3_PREFIX:-fyp-dev}
      S3_ENDPOINT_URL: http://minio:9000
      S3_SERVER_SIDE_ENCRYPTION: ""
      FYP_MODEL_PROJECT_PATH: /app/FYPModels
      FYP_MODEL_PYTHON: /usr/local/bin/python
      FYP_WORK_ROOT: /app/work
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - fyp_work_data:/app/work
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: fyp-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fyp_data}
      POSTGRES_USER: ${DB_USER:-fyp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fyp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fyp_user} -d ${DB_NAME:-fyp_data}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: fyp-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fyp-data-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fyp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - fyp_minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: fyp-data-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fyp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      S3_BUCKET: ${S3_BUCKET:-fyp-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"

volumes:
  fyp_postgres_data:
  fyp_minio_data:
  fyp_work_data:
