[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-data-platform"
version = "0.1.0"
description = "Storage and metadata platform for multimodal vEEG research datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "pandas>=2.0",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
ui = [
  "Flask>=3.0,<4",
]

[tool.setuptools.packages.find]
include = ["fyp_data_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
